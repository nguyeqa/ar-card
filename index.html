<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quan Nguyen — AR card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  :root{ --carbon:#0B0C0E; --bone:#F2F0EA; --red:#CF142B; --bronze:#C08B45; --slate:#8B9096; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; background:var(--carbon); color:var(--bone);
    font-family:'JetBrains Mono',ui-monospace,monospace; overflow:hidden; }
  body.ar-running{ background:transparent; }
  a{ color:inherit; text-decoration:none; }

  /* ---------- landing ---------- */
  #landing{ position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    justify-content:center; padding:32px 26px; background:var(--carbon); }
  #landing::before{ content:''; position:absolute; top:-40px; bottom:-40px; left:-14px; width:62px;
    transform:skewX(-13deg);
    background:linear-gradient(90deg,var(--bone) 0 18px,transparent 18px 22px,var(--red) 22px 29px,
      transparent 29px 33px,var(--bronze) 33px 36px,transparent 36px); }
  .wrap{ position:relative; margin-left:56px; }
  .kicker{ font-size:10px; font-weight:500; letter-spacing:.22em; text-transform:uppercase; color:var(--bronze); }
  h1{ font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:min(15vw,58px);
    line-height:.92; letter-spacing:-.01em; text-transform:uppercase; margin-top:10px; }
  .rule{ height:1px; width:150px; margin:16px 0 13px; background:linear-gradient(90deg,var(--bronze),transparent); }
  .role{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
  .focus{ font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--slate); margin-top:6px; }
  #start{ margin-top:28px; display:inline-flex; align-items:center; gap:10px; cursor:pointer;
    background:var(--bone); color:var(--carbon); border:0; border-radius:3px; padding:14px 20px;
    font-family:'Archivo',sans-serif; font-weight:800; font-size:14px; letter-spacing:.06em; text-transform:uppercase; }
  #start:active{ transform:translateY(1px); }
  .hint{ font-size:10px; letter-spacing:.1em; color:var(--slate); margin-top:12px; text-transform:uppercase; }
  .links{ position:relative; margin:34px 0 0 56px; display:flex; flex-wrap:wrap; gap:10px; }
  .link{ display:flex; align-items:center; gap:8px; border:1px solid #23262B; border-radius:3px;
    padding:9px 12px; font-size:11px; }
  .link img{ width:14px; height:14px; display:block; }

  /* ---------- in-AR chrome ---------- */
  #scan{ position:fixed; left:0; right:0; bottom:30px; z-index:15; text-align:center;
    font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--bone);
    text-shadow:0 1px 6px rgba(0,0,0,.8); display:none; }
  #scan span{ display:inline-block; background:rgba(11,12,14,.72); border:1px solid #2A2E34;
    border-radius:3px; padding:9px 14px; }
  #back{ position:fixed; top:14px; left:14px; z-index:15; display:none;
    background:rgba(11,12,14,.72); border:1px solid #2A2E34; border-radius:3px;
    color:var(--bone); font-family:inherit; font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; padding:9px 12px; }
  #gear{ position:fixed; top:14px; right:14px; z-index:17; display:none;
    background:rgba(11,12,14,.72); border:1px solid #2A2E34; border-radius:3px; color:var(--bone);
    font-family:inherit; font-size:15px; padding:8px 11px; }
  #tune{ position:fixed; right:12px; top:58px; z-index:18; display:none; width:214px;
    background:rgba(11,12,14,.94); border:1px solid #2A2E34; border-radius:5px; padding:12px;
    max-height:72vh; overflow:auto; }
  #tune label{ display:block; font-size:9px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--bronze); margin:9px 0 4px; }
  #tune label:first-child{ margin-top:0; }
  #tune input[type=range]{ width:100%; accent-color:#C08B45; }
  #tune select{ width:100%; background:#15181D; color:var(--bone); border:1px solid #2A2E34;
    border-radius:3px; padding:6px; font-family:inherit; font-size:11px; }
  #tune .val{ float:right; color:var(--bone); letter-spacing:0; }
  #tune code{ display:block; margin-top:10px; padding:7px; background:#15181D; border-radius:3px;
    font-size:9px; line-height:1.5; color:var(--slate); word-break:break-all; white-space:pre-wrap; }

  /* invisible tap targets that ride on top of the 3D tokens */
  .hit{ position:fixed; top:0; left:0; width:82px; height:82px; margin:-41px 0 0 -41px;
    border-radius:50%; z-index:16; display:none; }

  a-scene{ position:fixed; top:0; left:0; width:100%; height:100%; }
  a-scene .a-canvas{ background:transparent; }
</style>
</head>
<body>

<!-- ============ landing ============ -->
<div id="landing">
  <div class="wrap">
    <div class="kicker">Electrical Engineering &middot; Cincinnati &rsquo;28</div>
    <h1>Quan<br>Nguyen</h1>
    <div class="rule"></div>
    <div class="role">Vehicle Control Lead &middot; Bearcats Electric Racing</div>
    <div class="focus">Embedded software &middot; Vehicle controls &middot; Motor control</div>
    <button id="start">Start AR</button>
    <div class="hint">Allow the camera, then point it at the card</div>
  </div>
  <div class="links">
    <a class="link" href="https://www.linkedin.com/in/quan-nguyenuc/" target="_blank" rel="noopener">
      <img src="./assets/icon-linkedin.png?v=3" alt="">/in/quan-nguyenuc</a>
    <a class="link" href="https://github.com/nguyeqa" target="_blank" rel="noopener">
      <img src="./assets/icon-github.png?v=3" alt="">/nguyeqa</a>
    <a class="link" href="mailto:nguyeqa@mail.uc.edu">
      <img src="./assets/icon-email.png?v=3" alt="">nguyeqa@mail.uc.edu</a>
  </div>
</div>

<button id="back">&larr; Back</button>
<button id="gear">&#9881;</button>
<div id="scan"><span>Point at the card &middot; hold steady</span></div>

<div id="tune">
  <label>Placement</label>
  <select id="tPlace">
    <option value="top">Above the card</option>
    <option value="bottom">Below the card</option>
    <option value="left">Left of the card</option>
    <option value="right">Right of the card</option>
  </select>
  <label>Angle <span class="val" id="vAngle">125&deg;</span></label>
  <input type="range" id="tAngle" min="90" max="180" step="5" value="125">
  <label>Gap <span class="val" id="vGap">0.02</span></label>
  <input type="range" id="tGap" min="0" max="30" step="1" value="2">
  <label>Size <span class="val" id="vScale">1.00</span></label>
  <input type="range" id="tScale" min="50" max="150" step="5" value="100">
  <label>Scroll speed <span class="val" id="vSpeed">42</span></label>
  <input type="range" id="tSpeed" min="0" max="120" step="2" value="42">
  <label style="color:#8B9096">Avatar</label>
  <label>Across <span class="val" id="vAx">0.30</span></label>
  <input type="range" id="tAx" min="-80" max="80" step="2" value="30">
  <label>Up <span class="val" id="vAy">-0.02</span></label>
  <input type="range" id="tAy" min="-40" max="60" step="2" value="-2">
  <label>Size <span class="val" id="vAs">0.28</span></label>
  <input type="range" id="tAs" min="5" max="70" step="1" value="28">
  <label>Turn <span class="val" id="vAr">-20&deg;</span></label>
  <input type="range" id="tAr" min="-180" max="180" step="5" value="-20">
  <code id="tOut"></code>
</div>

<a class="hit" id="hitLinkedin" href="https://www.linkedin.com/in/quan-nguyenuc/" target="_blank" rel="noopener" aria-label="LinkedIn"></a>
<a class="hit" id="hitGithub"   href="https://github.com/nguyeqa" target="_blank" rel="noopener" aria-label="GitHub"></a>
<a class="hit" id="hitEmail"    href="mailto:nguyeqa@mail.uc.edu" aria-label="Email"></a>

<!-- ============ AR scene ============ -->
<a-scene
  mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.005"
  color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
  background="transparent: true"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

  <a-assets>
    <video id="clip" src="./assets/animated.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    <img id="icLinkedin" src="./assets/icon-linkedin.png?v=3">
    <img id="icGithub"   src="./assets/icon-github.png?v=3">
    <img id="icEmail"    src="./assets/icon-email.png?v=3">
    <canvas id="docCanvas" width="800" height="538"></canvas>
  </a-assets>

  <a-entity light="type: ambient; intensity: 0.75"></a-entity>
  <a-entity light="type: directional; intensity: 0.9" position="0.5 1 1.5"></a-entity>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">

    <!-- the printed card, alive -->
    <a-video src="#clip" width="1" height="0.571" position="0 0 0.002" material="shader: flat"></a-video>

    <!-- bronze frame -->
    <a-entity position="0 0 0.003">
      <a-plane width="1.02" height="0.006" position="0  0.291 0" color="#C08B45" material="shader: flat"></a-plane>
      <a-plane width="1.02" height="0.006" position="0 -0.291 0" color="#C08B45" material="shader: flat"></a-plane>
      <a-plane width="0.006" height="0.588" position=" 0.507 0 0" color="#C08B45" material="shader: flat"></a-plane>
      <a-plane width="0.006" height="0.588" position="-0.507 0 0" color="#C08B45" material="shader: flat"></a-plane>
    </a-entity>

    <!-- scrolling panel, hinged on the card's top edge.
         dihedral angle between card and panel = 180 - rotation.x -->
    <a-entity id="screen" position="0 0.305 0.008" rotation="55 0 0" scale="0.001 0.001 0.001">
      <a-entity id="screenPanel" position="0 0.37 0">
        <a-plane width="1.114" height="0.754" color="#C08B45" material="shader: flat"></a-plane>
        <a-plane id="docPlane" width="1.10" height="0.74" position="0 0 0.002"
                 material="shader: flat; src: #docCanvas" scroll-doc></a-plane>
      </a-entity>
    </a-entity>

    <!-- 3D avatar. Drop a rigged, animated avatar.glb into assets/ and it appears here. -->
    <a-gltf-model id="avatar" src="./assets/avatar.glb" visible="false"
                  animation-mixer="clip: *; loop: repeat; crossFadeDuration: 0.3"
                  position="0.30 -0.02 0.16" rotation="0 -20 0" scale="0.28 0.28 0.28"></a-gltf-model>

    <!-- floating tokens: bronze rim, dark face, glyph on both sides -->
    <a-entity id="tokens">
      <a-entity class="token" position="-0.31 -0.42 0.10" scale="0.001 0.001 0.001" hit-anchor="selector: #hitLinkedin">
        <a-entity animation__bob="property: position; from: 0 0 0; to: 0 0.022 0; dir: alternate; loop: true; dur: 1900; easing: easeInOutSine"
                  animation__tilt="property: rotation; from: 0 -17 0; to: 0 17 0; dir: alternate; loop: true; dur: 2700; easing: easeInOutSine">
          <a-cylinder radius="0.092" height="0.016" rotation="90 0 0" color="#C08B45" metalness="0.55" roughness="0.35"></a-cylinder>
          <a-circle radius="0.077" position="0 0  0.0085" color="#0F1218" material="shader: flat"></a-circle>
          <a-circle radius="0.077" position="0 0 -0.0085" rotation="0 180 0" color="#0F1218" material="shader: flat"></a-circle>
          <a-image src="#icLinkedin" width="0.088" height="0.088" position="0 0  0.0095" material="shader: flat; transparent: true"></a-image>
          <a-image src="#icLinkedin" width="0.088" height="0.088" position="0 0 -0.0095" rotation="0 180 0" material="shader: flat; transparent: true"></a-image>
        </a-entity>
        <a-text value="LINKEDIN" align="center" anchor="center" color="#F2F0EA" width="0.62" position="0 -0.135 0"></a-text>
      </a-entity>

      <a-entity class="token" position="0 -0.42 0.10" scale="0.001 0.001 0.001" hit-anchor="selector: #hitGithub">
        <a-entity animation__bob="property: position; from: 0 0 0; to: 0 0.022 0; dir: alternate; loop: true; dur: 1900; delay: 240; easing: easeInOutSine"
                  animation__tilt="property: rotation; from: 0 -17 0; to: 0 17 0; dir: alternate; loop: true; dur: 2700; delay: 240; easing: easeInOutSine">
          <a-cylinder radius="0.092" height="0.016" rotation="90 0 0" color="#C08B45" metalness="0.55" roughness="0.35"></a-cylinder>
          <a-circle radius="0.077" position="0 0  0.0085" color="#0F1218" material="shader: flat"></a-circle>
          <a-circle radius="0.077" position="0 0 -0.0085" rotation="0 180 0" color="#0F1218" material="shader: flat"></a-circle>
          <a-image src="#icGithub" width="0.088" height="0.088" position="0 0  0.0095" material="shader: flat; transparent: true"></a-image>
          <a-image src="#icGithub" width="0.088" height="0.088" position="0 0 -0.0095" rotation="0 180 0" material="shader: flat; transparent: true"></a-image>
        </a-entity>
        <a-text value="GITHUB" align="center" anchor="center" color="#F2F0EA" width="0.62" position="0 -0.135 0"></a-text>
      </a-entity>

      <a-entity class="token" position="0.31 -0.42 0.10" scale="0.001 0.001 0.001" hit-anchor="selector: #hitEmail">
        <a-entity animation__bob="property: position; from: 0 0 0; to: 0 0.022 0; dir: alternate; loop: true; dur: 1900; delay: 480; easing: easeInOutSine"
                  animation__tilt="property: rotation; from: 0 -17 0; to: 0 17 0; dir: alternate; loop: true; dur: 2700; delay: 480; easing: easeInOutSine">
          <a-cylinder radius="0.092" height="0.016" rotation="90 0 0" color="#C08B45" metalness="0.55" roughness="0.35"></a-cylinder>
          <a-circle radius="0.077" position="0 0  0.0085" color="#0F1218" material="shader: flat"></a-circle>
          <a-circle radius="0.077" position="0 0 -0.0085" rotation="0 180 0" color="#0F1218" material="shader: flat"></a-circle>
          <a-image src="#icEmail" width="0.088" height="0.088" position="0 0  0.0095" material="shader: flat; transparent: true"></a-image>
          <a-image src="#icEmail" width="0.088" height="0.088" position="0 0 -0.0095" rotation="0 180 0" material="shader: flat; transparent: true"></a-image>
        </a-entity>
        <a-text value="EMAIL" align="center" anchor="center" color="#F2F0EA" width="0.62" position="0 -0.135 0"></a-text>
      </a-entity>
    </a-entity>

  </a-entity>
</a-scene>

<script>
// ======================================================================
// components
// ======================================================================
AFRAME.registerComponent('scroll-doc', {
  init: function () {
    this.el.addEventListener('materialtextureloaded', () => {
      const m = this.el.getObject3D('mesh');
      if (m && m.material.map) {
        m.material.map.generateMipmaps = false;
        m.material.map.minFilter = THREE.LinearFilter;
        m.material.map.magFilter = THREE.LinearFilter;
      }
    });
  }
});

// keeps an invisible DOM link glued to a 3D object's position on screen
AFRAME.registerComponent('hit-anchor', {
  schema: { selector: { type: 'string' } },
  init: function () {
    this.v = new THREE.Vector3();
    this.anchor = document.querySelector(this.data.selector);
  },
  tick: function () {
    if (!this.anchor) return;
    const cam = this.el.sceneEl.camera;
    if (!cam || !window.__cardVisible) { this.anchor.style.display = 'none'; return; }
    this.el.object3D.getWorldPosition(this.v);
    this.v.project(cam);
    if (this.v.z > 1) { this.anchor.style.display = 'none'; return; }
    const x = (this.v.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-this.v.y * 0.5 + 0.5) * window.innerHeight;
    this.anchor.style.display = 'block';
    this.anchor.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  }
});

// ======================================================================
// the scrolling document
//   Everything is drawn once into a tall offscreen canvas. A window onto
//   it scrolls continuously and wraps, so content loops smoothly and can
//   never spill outside the panel.
// ======================================================================
const Doc = (function () {
  const W = 800, VIEW_H = 538, PAD_X = 44;
  const BRONZE = '#C08B45', BONE = '#F2F0EA', SLATE = '#8B9096', CARBON = '#0B0C0E';
  const F = '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif';

  const view = document.getElementById('docCanvas');
  const vctx = view.getContext('2d');
  const doc = document.createElement('canvas');
  doc.width = W;
  const dctx = doc.getContext('2d');

  const imgs = {};
  const START_DELAY = 3000;          // hold at the top this long before scrolling
  let ready = false, offset = 0, last = performance.now(), docH = 1, speed = 42;
  let holdUntil = 0;

  function load(name, src) {
    return new Promise(res => {
      const i = new Image();
      i.onload = () => { imgs[name] = i; res(); };
      i.onerror = () => res();
      i.src = src;
    });
  }

  function build() {
    const ops = [];
    let y = 0;
    const line = (text, font, color, dy, x) => {
      y += dy;
      ops.push({ t: 'text', text, font, color, x: x === undefined ? PAD_X : x, y });
    };
    const label = text => line(text, '600 22px ' + F, BRONZE, 48);
    const bullet = text => {
      y += 40;
      ops.push({ t: 'dot', x: PAD_X + 4, y: y - 9 });
      ops.push({ t: 'text', text, font: '400 28px ' + F, color: BONE, x: PAD_X + 26, y });
    };
    const rule = () => { y += 28; ops.push({ t: 'rule', y }); };
    const figure = (img, w, dy) => {                       // centred image with a bronze edge
      if (!img) return;
      const h = w / (img.width / img.height);
      y += dy;
      ops.push({ t: 'img', img, x: (W - w) / 2, y, w, h });
      y += h;
    };
    const para = (text, font, color, dy, lh) => {          // wraps to the panel width
      y += dy;
      dctx.font = font;
      const maxW = W - PAD_X * 2;
      let cur = '';
      text.split(' ').forEach(word => {
        const test = cur ? cur + ' ' + word : word;
        if (dctx.measureText(test).width > maxW && cur) {
          ops.push({ t: 'text', text: cur, font, color, x: PAD_X, y });
          y += lh;
          cur = word;
        } else { cur = test; }
      });
      if (cur) ops.push({ t: 'text', text: cur, font, color, x: PAD_X, y });
    };

    label('INTRODUCTION');
    line("Hi, I am Quan Nguyen", '700 46px ' + F, BONE, 66);
    para('3rd year Electrical Engineering student at the University of Cincinnati.',
         '400 27px ' + F, SLATE, 46, 36);
    para('So far I have completed two co-op rotations, at FFE Inc. and Sensory Robotics, '
       + 'where I worked hands-on with both hardware and software in the electrical industry.',
         '400 27px ' + F, BONE, 44, 36);
    para('I am also an active member of Bearcats Electric Racing, where we design, build and '
       + 'race a Formula-style electric vehicle. I take care of the main control of the car.',
         '400 27px ' + F, BONE, 40, 36);
    rule();

    label('BEARCATS ELECTRIC RACING');
    line('Formula-style electric race car', '400 26px ' + F, SLATE, 42);
    line('2025 - 2026', '600 26px ' + F, BONE, 38);

    line('2026 - Vehicle Control Lead', '600 30px ' + F, BRONZE, 56);
    para('Programmed the RCM-112 ECU and implemented torque vectoring control for vehicle '
       + 'stability through cornering.', '400 27px ' + F, BONE, 44, 36);
    figure(imgs.corner, W - PAD_X * 2, 26);
    para('Laid out the CAN architecture and the communications system of the car, keeping '
       + 'bus load under 75% with no dropped messages.', '400 27px ' + F, BONE, 46, 36);
    figure(imgs.can, 470, 26);

    line('2025 - HV System Co-Lead', '600 30px ' + F, BRONZE, 62);
    para('Wrote a MATLAB script to monitor CAN message rates from the BMS, and finalised the '
       + 'offsets and factors in the DBC file.', '400 27px ' + F, BONE, 44, 36);
    figure(imgs.bench, W - PAD_X * 2, 26);
    para('Built a battery simulation in Simulink for the 28s5p pack, giving 517 V under an '
       + '80 kW load.', '400 27px ' + F, BONE, 46, 36);
    figure(imgs.packsim, W - PAD_X * 2, 26);
    para('Built a sledge that lets the accumulator slide into the chassis, making installation '
       + 'a one-person job.', '400 27px ' + F, BONE, 46, 36);
    figure(imgs.sledge, W - PAD_X * 2, 26);
    line('Team: 16th overall, FSAE', '400 25px ' + F, SLATE, 46);
    rule();

    label('CO-OP');
    line('Sensory Robotics', '600 28px ' + F, BONE, 46);
    para('Robotics engineering intern - perception pipeline for a SICK time-of-flight camera '
       + 'on a MiR600 mobile robot, in Python and ROS 2.', '400 26px ' + F, SLATE, 38, 34);
    line('FFE Inc.', '600 28px ' + F, BONE, 48);
    para('Electrical intern - hands-on hardware and software in the electrical industry.',
         '400 26px ' + F, SLATE, 38, 34);
    line('1819 Makerspace', '600 28px ' + F, BONE, 48);
    para('Prototyping, fabrication and shop support.', '400 26px ' + F, SLATE, 38, 34);
    rule();

    label('SKILLS');
    line('Embedded', '600 26px ' + F, BONE, 44);
    line('C / C++ firmware, Simulink, Embedded Coder', '400 26px ' + F, BONE, 36);
    line('CAN bus + DBC, BMS, high voltage', '400 26px ' + F, BONE, 36);
    line('Controls', '600 26px ' + F, BONE, 46);
    line('FOC / SVPWM, torque vectoring', '400 26px ' + F, BONE, 36);
    line('Traction control, lap time simulation', '400 26px ' + F, BONE, 36);
    line('Tools', '600 26px ' + F, BONE, 46);
    line('MATLAB, Python, ROS 2, OpenCV, Linux, Git', '400 26px ' + F, BONE, 36);
    rule();

    label('PROJECTS');
    bullet('EV4 ECU - Simulink to flash');
    bullet('CAN telemetry to the pit wall');
    bullet('Lap time simulation in MATLAB');
    bullet('Traction control + TV models');
    bullet('BMS firmware on Teensy');
    bullet('ToF perception, SICK + ROS 2');
    line('github.com/nguyeqa', '400 25px ' + F, SLATE, 48);
    line('nguyeqa@mail.uc.edu', '400 25px ' + F, BRONZE, 40);

    y += 90;
    docH = Math.ceil(y);
    doc.height = docH;

    dctx.fillStyle = CARBON;
    dctx.fillRect(0, 0, W, docH);
    dctx.textBaseline = 'alphabetic';
    ops.forEach(o => {
      if (o.t === 'text') { dctx.font = o.font; dctx.fillStyle = o.color; dctx.fillText(o.text, o.x, o.y); }
      else if (o.t === 'dot') { dctx.fillStyle = BRONZE; dctx.fillRect(o.x, o.y, 9, 9); }
      else if (o.t === 'rule') { dctx.fillStyle = '#2A2E34'; dctx.fillRect(PAD_X, o.y, W - PAD_X * 2, 2); }
      else if (o.t === 'img') {
        dctx.fillStyle = BRONZE;
        dctx.fillRect(o.x - 3, o.y - 3, o.w + 6, o.h + 6);
        dctx.drawImage(o.img, o.x, o.y, o.w, o.h);
      }
    });
    ready = true;
  }

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (ready) {
      if (window.__cardVisible && now >= holdUntil) offset = (offset + speed * dt) % docH;
      vctx.fillStyle = CARBON;
      vctx.fillRect(0, 0, W, VIEW_H);
      vctx.drawImage(doc, 0, -offset);
      vctx.drawImage(doc, 0, docH - offset);   // second copy makes the wrap seamless
      const plane = document.getElementById('docPlane');
      const mesh = plane && plane.getObject3D('mesh');
      if (mesh && mesh.material.map) mesh.material.map.needsUpdate = true;
    }
    requestAnimationFrame(frame);
  }

  Promise.all([
    load('corner', './assets/diagram-corner.png?v=1'),
    load('ber', './assets/logo-ber.png?v=1'),
    load('can', './assets/diagram-can.png?v=1'),
    load('sledge', './assets/photo-sledge.png?v=1'),
    load('bench', './assets/photo-canbench.png?v=1'),
    load('packsim', './assets/diagram-packsim.png?v=1')
  ]).then(() => { build(); holdUntil = performance.now() + START_DELAY; });
  requestAnimationFrame(frame);

  return {
    // back to the top, then pause before it starts moving again
    reset: () => { offset = 0; holdUntil = performance.now() + START_DELAY; },
    setSpeed: v => { speed = v; }
  };
})();

// ======================================================================
// panel placement
//   'angle' is the dihedral angle between card and panel: 180 flat, 90 upright.
// ======================================================================
const CARD_HALF_W = 0.51, CARD_HALF_H = 0.286;
const PANEL_HALF_W = 0.557, PANEL_HALF_H = 0.377;

const cfg = Object.assign(
  { place: 'top', angle: 125, gap: 0.02, scale: 1, speed: 42,
    ax: 0.30, ay: -0.02, as: 0.28, ar: -20 },
  JSON.parse(localStorage.getItem('arCardLayout') || '{}')
);

function applyLayout() {
  const screenEl = document.getElementById('screen');
  const panelEl  = document.getElementById('screenPanel');
  const tilt = 180 - cfg.angle;
  const s = cfg.scale;
  let hinge, rot, offset;

  if (cfg.place === 'top') {
    hinge = [0, CARD_HALF_H + cfg.gap, 0.008];  rot = [tilt, 0, 0];
    offset = [0, PANEL_HALF_H * s, 0];
  } else if (cfg.place === 'bottom') {
    hinge = [0, -(CARD_HALF_H + cfg.gap), 0.008]; rot = [-tilt, 0, 0];
    offset = [0, -PANEL_HALF_H * s, 0];
  } else if (cfg.place === 'left') {
    hinge = [-(CARD_HALF_W + cfg.gap), 0, 0.008]; rot = [0, tilt, 0];
    offset = [-PANEL_HALF_W * s, 0, 0];
  } else {
    hinge = [CARD_HALF_W + cfg.gap, 0, 0.008];  rot = [0, -tilt, 0];
    offset = [PANEL_HALF_W * s, 0, 0];
  }

  screenEl.setAttribute('position', hinge.join(' '));
  screenEl.setAttribute('rotation', rot.join(' '));
  panelEl.setAttribute('position', offset.join(' '));
  panelEl.setAttribute('scale', s + ' ' + s + ' ' + s);

  const av = document.getElementById('avatar');
  av.setAttribute('position', cfg.ax + ' ' + cfg.ay + ' 0.16');
  av.setAttribute('scale', cfg.as + ' ' + cfg.as + ' ' + cfg.as);
  av.setAttribute('rotation', '0 ' + cfg.ar + ' 0');

  Doc.setSpeed(cfg.speed);

  document.getElementById('tOut').textContent =
    'position="' + hinge.map(n => +n.toFixed(3)).join(' ') + '"\n' +
    'rotation="' + rot.map(n => +n.toFixed(1)).join(' ') + '"\n' +
    'scroll speed ' + cfg.speed;
  localStorage.setItem('arCardLayout', JSON.stringify(cfg));
}

// ======================================================================
// wiring
// ======================================================================
const scene    = document.querySelector('a-scene');
const landing  = document.getElementById('landing');
const scanHint = document.getElementById('scan');
const backBtn  = document.getElementById('back');
const gear     = document.getElementById('gear');
const tune     = document.getElementById('tune');
const target   = document.getElementById('target');
const clip     = document.getElementById('clip');
const screenEl = document.getElementById('screen');
const avatarEl = document.getElementById('avatar');
const tokens   = Array.from(document.querySelectorAll('.token'));
const hits     = Array.from(document.querySelectorAll('.hit'));

window.__cardVisible = false;

function grow(el, delay) {
  el.setAttribute('animation__pop',
    'property: scale; to: 1 1 1; dur: 380; delay: ' + (delay || 0) + '; easing: easeOutBack');
}
function shrink(el) {
  el.setAttribute('animation__pop', 'property: scale; to: 0.001 0.001 0.001; dur: 150; easing: easeInQuad');
}

target.addEventListener('targetFound', () => {
  window.__cardVisible = true;
  scanHint.style.display = 'none';
  clip.currentTime = 0;
  clip.play().catch(() => {});
  Doc.reset();
  grow(screenEl, 0);
  tokens.forEach((t, i) => grow(t, 120 + i * 110));
  if (avatarEl.getObject3D('mesh')) avatarEl.setAttribute('visible', true);
});

target.addEventListener('targetLost', () => {
  window.__cardVisible = false;
  scanHint.style.display = 'block';
  clip.pause();
  shrink(screenEl);
  tokens.forEach(shrink);
  avatarEl.setAttribute('visible', false);
  hits.forEach(h => h.style.display = 'none');
});

avatarEl.addEventListener('model-loaded', () => {
  if (window.__cardVisible) avatarEl.setAttribute('visible', true);
});

document.getElementById('start').addEventListener('click', async () => {
  try { await clip.play(); clip.pause(); } catch (e) {}
  landing.style.display = 'none';
  document.body.classList.add('ar-running');
  scanHint.style.display = 'block';
  backBtn.style.display = 'block';
  gear.style.display = 'block';
  const go = async () => {
    try { await scene.systems['mindar-image-system'].start(); }
    catch (err) { scanHint.innerHTML = '<span>Could not start: ' + (err && err.message ? err.message : err) + '</span>'; }
  };
  if (scene.hasLoaded) go(); else scene.addEventListener('loaded', go);
});

backBtn.addEventListener('click', () => {
  scene.systems['mindar-image-system'].stop();
  window.__cardVisible = false;
  landing.style.display = 'flex';
  document.body.classList.remove('ar-running');
  scanHint.style.display = 'none';
  backBtn.style.display = 'none';
  gear.style.display = 'none';
  tune.style.display = 'none';
  hits.forEach(h => h.style.display = 'none');
});

gear.addEventListener('click', () => {
  tune.style.display = tune.style.display === 'block' ? 'none' : 'block';
});

// tuner sliders
document.getElementById('tPlace').value = cfg.place;
document.getElementById('tPlace').addEventListener('change', e => { cfg.place = e.target.value; applyLayout(); });

[['tAngle','vAngle','angle',1,'deg'], ['tGap','vGap','gap',100,'2dp'],
 ['tScale','vScale','scale',100,'2dp'], ['tSpeed','vSpeed','speed',1,'int'],
 ['tAx','vAx','ax',100,'2dp'], ['tAy','vAy','ay',100,'2dp'],
 ['tAs','vAs','as',100,'2dp'], ['tAr','vAr','ar',1,'deg']].forEach(([id, out, key, div, fmt]) => {
  const el = document.getElementById(id), lab = document.getElementById(out);
  const show = v => lab.textContent = fmt === 'deg' ? v + '\u00B0' : (fmt === '2dp' ? v.toFixed(2) : v);
  el.value = Math.round(cfg[key] * div);
  show(cfg[key]);
  el.addEventListener('input', e => {
    cfg[key] = div === 1 ? +e.target.value : +e.target.value / div;
    show(cfg[key]);
    applyLayout();
  });
});

scene.addEventListener('loaded', applyLayout);
</script>
